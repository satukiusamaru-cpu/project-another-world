<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15152b"><title>Project Another World · 0.4</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',system-ui,sans-serif;color:#f6f1ff;background:#131528}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#50406d,#17182d 58%,#101326);}.wrap{max-width:570px;margin:auto;padding:18px 15px 90px}header{text-align:center;padding:10px 0}h1{font:normal 29px Georgia,serif;color:#f8db9b;margin:8px 0 5px}header small{color:#d3c5e6;letter-spacing:.07em}h2{color:#ffe1a4;font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:14px 0 8px;color:#f7dcab}p{line-height:1.7}.stats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:13px 0}.pill{font-size:12px;background:#302b4e;border:1px solid #66577f;padding:7px 10px;border-radius:18px}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;position:sticky;top:0;z-index:4;background:#17182cf2;padding:8px 0;border-bottom:1px solid #5a5270}.nav button{font-size:11px;padding:8px 2px;min-height:48px}.nav button.active{background:#886ca2;border-color:#e0b8ec}.panel{background:#25243eea;border:1px solid #72658a;border-radius:18px;padding:19px;margin-top:15px;box-shadow:0 8px 22px #0003}.scene{height:185px;border-radius:15px;background:linear-gradient(180deg,#55548c 0%,#8d6d99 49%,#4b5b66 50%,#253f43 100%);position:relative;overflow:hidden;display:grid;place-items:center;margin:12px 0}.scene:before{content:'✦　✧　　　　✦　　　✧';position:absolute;top:13px;left:12px;color:#fff9;font-size:23px}.scene .art{font-size:76px;filter:drop-shadow(0 8px 8px #15132680)}.scene .ground{position:absolute;bottom:9px;font-size:13px;background:#111a2bb5;padding:6px 12px;border-radius:20px}.dialogue{background:#181c36;border-left:3px solid #d7b77c;padding:13px;border-radius:10px;line-height:1.75;margin:12px 0}.dialogue strong{color:#f5d8a4}button{cursor:pointer;font:inherit;color:#fff;background:#4b406b;border:1px solid #897aa8;border-radius:12px;padding:11px;min-height:44px}button.primary{background:#97709d;border-color:#e5b7e2;font-weight:700}button:disabled{opacity:.5}.actions{display:grid;gap:9px;margin-top:14px}.muted{font-size:13px;color:#c7c0d8}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #625676;padding:11px;border-radius:12px;margin:9px 0}.item button{white-space:nowrap}.enemy{text-align:center;font-size:75px;margin:6px}.bar{height:11px;background:#4c4962;border-radius:20px;overflow:hidden}.bar span{display:block;background:#ed86a7;height:100%;transition:width .2s}.toast{margin-top:14px;color:#ffe2a0;min-height:24px;line-height:1.5}.tag{display:inline-block;background:#4e4569;border-radius:20px;padding:5px 10px;font-size:12px}.quest{border:1px solid #625676;border-radius:12px;padding:12px;margin:10px 0}.quest.done{opacity:.7}.garden{display:flex;gap:14px;justify-content:center;font-size:43px;margin:15px 0;flex-wrap:wrap}.footer{text-align:center;color:#a8a0bd;font-size:11px;margin-top:20px}.choices{display:grid;gap:9px;margin-top:12px}.choices button{text-align:left}.portrait{font-size:70px;text-align:center}.smallline{font-size:12px;color:#c8bed8}button:focus-visible{outline:3px solid #ffe3a6;outline-offset:2px}
</style></head><body><div class="wrap"><header><h1>✦ Project Another World ✦</h1><small>MAGIC ACADEMY · VERSION 0.4</small></header><div class="stats" id="stats"></div><nav class="nav" id="nav"></nav><main id="main"></main><div class="footer">セーブデータはこのブラウザ内に保存されます · Ver. 0.4</div></div><script>
'use strict';const KEY='paw-mobile-v1';const DEFAULT={coins:0,xp:0,level:1,items:[],wins:0,quest:false,chapter:0,quest2:false,quest3:false,flowers:0,avatar:'🧙‍♀️',nickname:'冒険者',talked:false,location:'academy',studyDone:0,decor:'なし'};let state;try{state={...DEFAULT,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state={...DEFAULT}}if(!Array.isArray(state.items))state.items=[];let page='home',msg='',enemyHP=3,enemyIndex=0,question=null,answered=0;const enemies=[{name:'森のスライム',emoji:'🟣',hp:3,desc:'魔法学校の森に現れた小さな魔物'},{name:'月影のコウモリ',emoji:'🦇',hp:4,desc:'古い図書館の鍵を守っている'},{name:'星屑のゴーレム',emoji:'🗿',hp:5,desc:'魔法の塔で眠っていた守護者'}];const qs=[{q:'「りんご」は英語で？',a:['Apple','Orange','Grape'],c:0,tip:'Apple = りんご'},{q:'「図書館」は英語で？',a:['Hospital','Library','Station'],c:1,tip:'Library = 図書館'},{q:'「勇敢な」は英語で？',a:['Quiet','Brave','Heavy'],c:1,tip:'Brave = 勇敢な'},{q:'I ___ a student.',a:['am','is','are'],c:0,tip:'I am a student. が正しい形'},{q:'「魔法」は英語で？',a:['Magic','Music','Market'],c:0,tip:'Magic = 魔法'},{q:'She ___ English.',a:['study','studies','studying'],c:1,tip:'三人称単数の現在形は studies'},{q:'「冒険」は英語で？',a:['Adventure','Weather','Furniture'],c:0,tip:'Adventure = 冒険'},{q:'「秘密」は英語で？',a:['Secret','Season','Subject'],c:0,tip:'Secret = 秘密'},{q:'He ___ a book yesterday.',a:['read','reads','reading'],c:0,tip:'read の過去形は綴りが同じ'},{q:'「星」は英語で？',a:['Stone','Star','Story'],c:1,tip:'Star = 星'},{q:'There ___ two cats.',a:['is','am','are'],c:2,tip:'複数なので are を使う'}];const goods=[{name:'魔法のリボン',icon:'🎀',cost:80},{name:'星の杖',icon:'🪄',cost:120},{name:'妖精のランプ',icon:'🏮',cost:150},{name:'小さな花壇',icon:'🌷',cost:100},{name:'月のティアラ',icon:'👑',cost:200},{name:'星空のドレス',icon:'👗',cost:250},{name:'白猫のぬいぐるみ',icon:'🐈',cost:90}];const navs=[['home','🏰','ホーム'],['map','🗺️','探索'],['quest','📜','依頼'],['battle','⚔️','バトル'],['shop','🛍️','お店'],['room','🏡','生活']];function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){msg+=' ※保存できない環境です'}}function gainXP(n){state.xp+=n;while(state.xp>=state.level*100){state.xp-=state.level*100;state.level++;msg+=' ✨レベルアップ！'}}function btn(label,call,cls='',disabled=false){return `<button class="${cls}" onclick="${call}" ${disabled?'disabled':''}>${label}</button>`}function go(p){page=p;msg='';render();window.scrollTo({top:0,behavior:'instant'})}function scene(emoji,caption){return `<div class="scene"><div class="art">${emoji}</div><div class="ground">${caption}</div></div>`}function render(){document.getElementById('stats').innerHTML=`<span class="pill">⭐ Lv.${state.level}</span><span class="pill">✨ ${state.xp}/${state.level*100} EXP</span><span class="pill">🪙 ${state.coins}</span>`;document.getElementById('nav').innerHTML=navs.map(([p,i,n])=>btn(i+'<div>'+n+'</div>',`go('${p}')`,page===p?'active':'')).join('');let s='';if(page==='home'){s=`<h2>ようこそ、${safe(state.nickname)}！</h2>${scene('🏰','ルミナ魔法学園 · はじまりの広場')}<div class="dialogue"><strong>案内役・ルナ 🧝‍♀️</strong><br>${state.chapter===0?'「目が覚めた？ ここは言葉が魔法になる世界。まずは私と話してみよう！」':state.chapter===1?'「森に魔物が現れたの！ 英語の魔法で学園を守って！」':'「すごい！ もっと広い世界を冒険して、あなたの物語を作ってね。」'}</div><div class="actions">${btn(state.chapter===0?'ルナと話す':'ルナとお話しする',"go('story')",'primary')}${btn('今日のクエストを見る',"go('quest')")}${btn('魔法バトルへ',"go('battle')")}${btn('🗺️ 異世界を探索する',"go('map')")}</div>`}if(page==='map'){let spots=[['academy','🏰','ルミナ魔法学園','ルナと話し、冒険の準備をする'],['forest','🌲','月光の森','スライムが現れる不思議な森'],['library','📚','古い図書館','コウモリが守る秘密の書庫'],['tower','🗼','星の塔','ゴーレムが眠る場所'],['town','🏘️','星明かりの街','お買い物を楽しめる街'],['house','🏡','マイルーム','家具と花を飾る自分の家']];s=`<h2>🗺️ 異世界マップ</h2><p class=muted>行きたい場所を選ぼう。探索と学習が冒険につながるよ。</p>${scene('🗺️','ルミナ地方・冒険マップ')}${spots.map(([id,icon,name,detail])=>`<div class=item><span><strong>${icon} ${name}</strong><br><span class=smallline>${detail}</span></span>${btn('移動',`visit('${id}')`,'primary')}</div>`).join('')}`}if(page==='story'){let lines=[['ルナ','「ここはルミナ魔法学園。英語の知識を魔力に変える、不思議な場所よ。」'],['ルナ','「魔物に襲われたら、問題に答えて魔法を使ってね。正解すれば攻撃できるの！」'],['ルナ','「さあ、あなたの最初の冒険が始まるよ！」']];let step=Math.min(state.chapter,2);s=`<h2>📖 第1章・異世界への招待</h2>${scene('🧝‍♀️','案内役・ルナ')}<div class="dialogue"><strong>${lines[step][0]}</strong><br>${lines[step][1]}</div><div class="actions">${btn(step<2?'次の会話へ':'冒険を始める',step<2?'nextStory()':"go('quest')",'primary')}${btn('ホームに戻る',"go('home')")}</div>`}if(page==='quest'){let quests=[{name:'はじめての討伐',detail:'森のスライムを1体倒す',done:state.quest,reward:'100コイン・50 EXP'},{name:'図書館の秘密',detail:'月影のコウモリを1体倒す',done:state.quest2,reward:'140コイン・60 EXP'},{name:'塔の守護者',detail:'星屑のゴーレムを1体倒す',done:state.quest3,reward:'200コイン・90 EXP'}];s=`<h2>📜 冒険者ギルド</h2><p class="muted">英語の魔法で魔物を倒して依頼を達成しよう。報酬は初回だけ獲得できるよ。</p>${quests.map((q,i)=>`<div class="quest ${q.done?'done':''}"><div class="row"><strong>${q.done?'✅':'📜'} ${q.name}</strong><span class="tag">${q.done?'達成':'未達成'}</span></div><p>${q.detail}</p><div class="smallline">報酬：${q.reward}</div><div class="actions">${btn(q.done?'もう一度戦う':'討伐へ向かう',`startBattle(${i})`,'primary')}</div></div>`).join('')}`}if(page==='battle'){let en=enemies[enemyIndex];if(!question)question=qs[Math.floor(Math.random()*qs.length)];s=`<h2>⚔️ 魔法バトル</h2><div class="row"><span class="tag">${safe(en.name)}</span><span class="smallline">正解して攻撃！</span></div><div class="enemy">${en.emoji}</div><div class="row"><span>HP</span><span>${enemyHP}/${en.hp}</span></div><div class="bar"><span style="width:${Math.max(0,enemyHP/en.hp*100)}%"></span></div><h3>✨ 魔法の問題</h3><p>${safe(question.q)}</p><div class="choices">${question.a.map((a,i)=>btn(safe(a),`answer(${i})`)).join('')}</div><p class="muted">正解：10コイン + 15 EXP / 討伐成功：追加報酬</p><div class="actions">${btn('別の魔物を選ぶ',"go('quest')")}</div>`}if(page==='shop'){s=`<h2>🛍️ 星明かりのショップ</h2><p class="muted">魔法で稼いだコインを使って、好きな服や家具を集めよう。</p>${goods.map((g,i)=>`<div class="item"><span><strong>${g.icon} ${g.name}</strong><br><span class="smallline">🪙 ${g.cost}</span></span>${btn(state.items.includes(g.name)?'購入済み':'購入',`buy(${i})`,'primary',state.items.includes(g.name))}</div>`).join('')}`}if(page==='room'){s=`<h2>🏡 わたしの異世界生活</h2>${scene(state.avatar,'あなたのマイルーム')}<div class="row"><strong>アバターを選ぶ</strong><span class="smallline">何度でも変更OK</span></div><div class="choices" style="grid-template-columns:repeat(3,1fr)">${['🧙‍♀️','🧝‍♀️','🧑‍🎓','🧙','🧚','🐈'].map((a,i)=>btn(a,`avatar(${i})`,state.avatar===a?'primary':'' )).join('')}</div><h3>🪑 お部屋の飾りつけ</h3><p class="muted">ショップで購入したアイテムを飾ろう！</p><div class="garden">${state.decor==='なし'?'✨':(goods.find(g=>g.name===state.decor)?.icon||'✨')}</div><div class="actions">${state.items.length?state.items.map((name,i)=>btn('飾る：'+safe(name),`decorate(${i})`)).join(''):'<p class="muted">先にショップでアイテムを買ってね。</p>'}</div><h3>🌱 魔法の小さな庭</h3><div class="garden">${Array.from({length:Math.min(state.flowers,8)},()=>'<span>🌷</span>').join('')||'<span>🌱</span>'}</div><p class="muted">お花を植えるには30コイン必要だよ。庭には最大8輪まで飾れるよ。</p>${btn('🌷 お花を植える（30コイン）','plant()','primary',state.flowers>=8)}<h3>🎁 コレクション ${state.items.length}/${goods.length}</h3>${state.items.length?state.items.map(name=>{let g=goods.find(x=>x.name===name);return `<div class="item">${g?g.icon:'✨'} ${safe(name)}</div>`}).join(''):'<p class="muted">まだ何も持っていないよ。ショップでお気に入りを見つけよう！</p>'}<p class="smallline">累計バトル勝利：${state.wins}回</p>`}document.getElementById('main').innerHTML=`<section class="panel">${s}<div class="toast" role="status">${safe(msg)}</div></section>`}function visit(id){state.location=id;save();if(id==='academy')go('story');else if(id==='forest')startBattle(0);else if(id==='library')startBattle(1);else if(id==='tower')startBattle(2);else if(id==='town')go('shop');else go('room')}function decorate(i){state.decor=state.items[i];msg='✨ お部屋に飾ったよ！';save();render()}function nextStory(){state.chapter=Math.min(2,state.chapter+1);save();render()}function startBattle(i){enemyIndex=i;enemyHP=enemies[i].hp;question=null;go('battle')}function answer(i){if(!question)return;if(i===question.c){enemyHP--;state.coins+=10;msg='正解！ '+question.tip+' ✨ 魔法が命中！';gainXP(15);if(enemyHP<=0){let en=enemies[enemyIndex];state.wins++;state.coins+=50+enemyIndex*20;gainXP(35);msg='🎉 '+en.name+'を倒した！ 討伐報酬を獲得！';let flag=['quest','quest2','quest3'][enemyIndex];if(!state[flag]){state[flag]=true;let bonuses=[100,140,200],exps=[50,60,90];state.coins+=bonuses[enemyIndex];gainXP(exps[enemyIndex]);msg+=' 初回依頼達成！ +'+bonuses[enemyIndex]+'コイン';}enemyHP=en.hp}question=qs[Math.floor(Math.random()*qs.length)]}else{msg='もう一度！ '+question.tip;question=qs[Math.floor(Math.random()*qs.length)]}save();render()}function buy(i){let g=goods[i];if(state.items.includes(g.name))msg='もう持っているよ';else if(state.coins<g.cost)msg='コインが足りないよ。バトルで稼ごう！';else{state.coins-=g.cost;state.items.push(g.name);msg='✨ '+g.name+'を手に入れた！';save()}render()}function plant(){if(state.flowers>=8)msg='お庭はお花でいっぱい！';else if(state.coins<30)msg='30コイン必要だよ';else{state.coins-=30;state.flowers++;msg='🌷 お花が咲いた！';save()}render()}function avatar(i){state.avatar=['🧙‍♀️','🧝‍♀️','🧑‍🎓','🧙','🧚','🐈'][i];msg='アバターを変更したよ！';save();render()}render();
</script></body></html>
