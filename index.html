<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15152b"><title>Project Another World · 0.7</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',system-ui,sans-serif;color:#f6f1ff;background:#131528}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#50406d,#17182d 58%,#101326);}.wrap{max-width:570px;margin:auto;padding:18px 15px 90px}header{text-align:center;padding:10px 0}h1{font:normal 29px Georgia,serif;color:#f8db9b;margin:8px 0 5px}header small{color:#d3c5e6;letter-spacing:.07em}h2{color:#ffe1a4;font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:14px 0 8px;color:#f7dcab}p{line-height:1.7}.stats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:13px 0}.pill{font-size:12px;background:#302b4e;border:1px solid #66577f;padding:7px 10px;border-radius:18px}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;position:sticky;top:0;z-index:4;background:#17182cf2;padding:8px 0;border-bottom:1px solid #5a5270}.nav button{font-size:11px;padding:8px 2px;min-height:48px}.nav button.active{background:#886ca2;border-color:#e0b8ec}.panel{background:#25243eea;border:1px solid #72658a;border-radius:18px;padding:19px;margin-top:15px;box-shadow:0 8px 22px #0003}.scene{height:185px;border-radius:15px;background:linear-gradient(180deg,#55548c 0%,#8d6d99 49%,#4b5b66 50%,#253f43 100%);position:relative;overflow:hidden;display:grid;place-items:center;margin:12px 0}.scene:before{content:'✦　✧　　　　✦　　　✧';position:absolute;top:13px;left:12px;color:#fff9;font-size:23px}.scene .art{font-size:76px;filter:drop-shadow(0 8px 8px #15132680)}.scene .ground{position:absolute;bottom:9px;font-size:13px;background:#111a2bb5;padding:6px 12px;border-radius:20px}.dialogue{background:#181c36;border-left:3px solid #d7b77c;padding:13px;border-radius:10px;line-height:1.75;margin:12px 0}.dialogue strong{color:#f5d8a4}button{cursor:pointer;font:inherit;color:#fff;background:#4b406b;border:1px solid #897aa8;border-radius:12px;padding:11px;min-height:44px}button.primary{background:#97709d;border-color:#e5b7e2;font-weight:700}button:disabled{opacity:.5}.actions{display:grid;gap:9px;margin-top:14px}.muted{font-size:13px;color:#c7c0d8}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #625676;padding:11px;border-radius:12px;margin:9px 0}.item button{white-space:nowrap}.enemy{text-align:center;font-size:75px;margin:6px}.bar{height:11px;background:#4c4962;border-radius:20px;overflow:hidden}.bar span{display:block;background:#ed86a7;height:100%;transition:width .2s}.toast{margin-top:14px;color:#ffe2a0;min-height:24px;line-height:1.5}.tag{display:inline-block;background:#4e4569;border-radius:20px;padding:5px 10px;font-size:12px}.quest{border:1px solid #625676;border-radius:12px;padding:12px;margin:10px 0}.quest.done{opacity:.7}.garden{display:flex;gap:14px;justify-content:center;font-size:43px;margin:15px 0;flex-wrap:wrap}.footer{text-align:center;color:#a8a0bd;font-size:11px;margin-top:20px}.choices{display:grid;gap:9px;margin-top:12px}.choices button{text-align:left}.portrait{font-size:70px;text-align:center}.smallline{font-size:12px;color:#c8bed8}button:focus-visible{outline:3px solid #ffe3a6;outline-offset:2px}
.roomview{height:175px;border-radius:16px;overflow:hidden;margin:10px 0;border:2px solid #ad8cb2;background:linear-gradient(#8d759f 0 63%,#9b796a 63%);text-align:center;display:flex;flex-direction:column;justify-content:space-between}.roomwall{font-size:25px;color:#ffe3a6;padding-top:10px}.roomthings{display:flex;justify-content:space-evenly;align-items:center;font-size:46px;min-height:60px}.roomfloor{background:#5b435caa;padding:6px;font-size:11px;color:#fff5e8}
.map-frame{width:100%;max-width:420px;margin:auto;border:3px solid #b8a1d7;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #0005;background:#7aa78b}.map-frame canvas{width:100%;display:block;touch-action:manipulation}.enemy svg{max-width:100%;height:auto;filter:drop-shadow(0 7px 9px #0005)}.art svg{max-width:100%;height:auto}.hero-showcase{display:flex;align-items:center;gap:9px;min-height:290px}.hero-portrait{flex:1;min-width:0;height:300px;border:2px solid #d6bded;border-radius:14px;overflow:hidden;background:#3e355a}.hero-portrait img{height:100%;width:100%;object-fit:cover;object-position:center top}.hero-outfit{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}.hero-outfit small{color:#f1dba7}.monster-portrait{width:180px;height:180px;margin:auto;border-radius:20px;overflow:hidden;border:2px solid #c5a9eb;box-shadow:0 0 22px #ab83db80;background:#e6dcf5}.monster-portrait img{width:100%;height:100%;object-fit:cover}.world-preview{width:100%;border:2px solid #cfb2e3;border-radius:15px;overflow:hidden;margin:9px 0 14px;background:#403452}.world-preview img{display:block;width:100%;height:auto}.ground{text-align:center}.enemy{display:flex;justify-content:center;align-items:center}</style></head><body><div class="wrap"><header><h1>✦ Project Another World ✦</h1><small>MAGIC ACADEMY · VERSION 0.7</small></header><div class="stats" id="stats"></div><nav class="nav" id="nav"></nav><main id="main"></main><div class="footer">セーブデータはこのブラウザ内に保存されます · Ver. 0.7</div></div><script>
'use strict';const KEY='paw-mobile-v1';const DEFAULT={coins:0,xp:0,level:1,items:[],wins:0,quest:false,chapter:0,quest2:false,quest3:false,flowers:0,avatar:'🧙‍♀️',nickname:'冒険者',talked:false,location:'academy',studyDone:0,decor:'なし',outfit:'',accessory:'',roomDecor:[],seeds:0,harvests:0,plantTime:0,mapX:6,mapY:7};let state;try{state={...DEFAULT,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state={...DEFAULT}}if(!Array.isArray(state.items))state.items=[];if(!Array.isArray(state.roomDecor))state.roomDecor=[];if(state.roomDecor.length===0&&state.decor&&state.decor!=='なし'&&state.items.includes(state.decor))state.roomDecor=[state.decor];let page='home',msg='',enemyHP=3,enemyIndex=0,question=null,answered=0;const enemies=[{name:'森のスライム',emoji:'🟣',hp:3,desc:'魔法学校の森に現れた小さな魔物'},{name:'月影のコウモリ',emoji:'🦇',hp:4,desc:'古い図書館の鍵を守っている'},{name:'星屑のゴーレム',emoji:'🗿',hp:5,desc:'魔法の塔で眠っていた守護者'}];const qs=[{q:'「りんご」は英語で？',a:['Apple','Orange','Grape'],c:0,tip:'Apple = りんご'},{q:'「図書館」は英語で？',a:['Hospital','Library','Station'],c:1,tip:'Library = 図書館'},{q:'「勇敢な」は英語で？',a:['Quiet','Brave','Heavy'],c:1,tip:'Brave = 勇敢な'},{q:'I ___ a student.',a:['am','is','are'],c:0,tip:'I am a student. が正しい形'},{q:'「魔法」は英語で？',a:['Magic','Music','Market'],c:0,tip:'Magic = 魔法'},{q:'She ___ English.',a:['study','studies','studying'],c:1,tip:'三人称単数の現在形は studies'},{q:'「冒険」は英語で？',a:['Adventure','Weather','Furniture'],c:0,tip:'Adventure = 冒険'},{q:'「秘密」は英語で？',a:['Secret','Season','Subject'],c:0,tip:'Secret = 秘密'},{q:'He ___ a book yesterday.',a:['read','reads','reading'],c:0,tip:'read の過去形は綴りが同じ'},{q:'「星」は英語で？',a:['Stone','Star','Story'],c:1,tip:'Star = 星'},{q:'There ___ two cats.',a:['is','am','are'],c:2,tip:'複数なので are を使う'}];const goods=[{name:'魔法のリボン',icon:'🎀',cost:80},{name:'星の杖',icon:'🪄',cost:120},{name:'妖精のランプ',icon:'🏮',cost:150},{name:'小さな花壇',icon:'🌷',cost:100},{name:'月のティアラ',icon:'👑',cost:200},{name:'星空のドレス',icon:'👗',cost:250},{name:'白猫のぬいぐるみ',icon:'🐈',cost:90}];const wardrobe=[{name:'星空のドレス',icon:'👗',slot:'outfit'},{name:'魔法のリボン',icon:'🎀',slot:'accessory'},{name:'月のティアラ',icon:'👑',slot:'accessory'},{name:'星の杖',icon:'🪄',slot:'accessory'}];
const furniture=['妖精のランプ','小さな花壇','白猫のぬいぐるみ'];
const extraGoods=[{name:'桜色のドレス',icon:'👘',cost:160},{name:'月夜のマント',icon:'🧥',cost:180},{name:'花の髪飾り',icon:'🌸',cost:75},{name:'星のソファ',icon:'🛋️',cost:130},{name:'小さな本棚',icon:'📚',cost:110},{name:'ふわふわのベッド',icon:'🛏️',cost:220}];
goods.push(...extraGoods);
wardrobe.push({name:'桜色のドレス',icon:'👘',slot:'outfit'},{name:'月夜のマント',icon:'🧥',slot:'outfit'},{name:'花の髪飾り',icon:'🌸',slot:'accessory'});
furniture.push('星のソファ','小さな本棚','ふわふわのベッド');
const navs=[['home','🏰','ホーム'],['map','🗺️','探索'],['quest','📜','依頼'],['battle','⚔️','バトル'],['shop','🛍️','お店'],['room','🏡','生活']];function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){msg+=' ※保存できない環境です'}}function gainXP(n){state.xp+=n;while(state.xp>=state.level*100){state.xp-=state.level*100;state.level++;msg+=' ✨レベルアップ！'}}function btn(label,call,cls='',disabled=false){return `<button class="${cls}" onclick="${call}" ${disabled?'disabled':''}>${label}</button>`}function go(p){page=p;msg='';render();window.scrollTo({top:0,behavior:'instant'})}function scene(emoji,caption){return `<div class="scene"><div class="art">${emoji}</div><div class="ground">${caption}</div></div>`}function render(){document.getElementById('stats').innerHTML=`<span class="pill">⭐ Lv.${state.level}</span><span class="pill">✨ ${state.xp}/${state.level*100} EXP</span><span class="pill">🪙 ${state.coins}</span>`;document.getElementById('nav').innerHTML=navs.map(([p,i,n])=>btn(i+'<div>'+n+'</div>',`go('${p}')`,page===p?'active':'')).join('');let s='';if(page==='home'){s=`<h2>ようこそ、${safe(state.nickname)}！</h2><div class="world-preview"><img src="${ART.mapart}" alt="ルミナ魔法学園の世界イメージ"></div><div class="dialogue"><strong>案内役・ルナ 🧝‍♀️</strong><br>${state.chapter===0?'「目が覚めた？ ここは言葉が魔法になる世界。まずは私と話してみよう！」':state.chapter===1?'「森に魔物が現れたの！ 英語の魔法で学園を守って！」':'「すごい！ もっと広い世界を冒険して、あなたの物語を作ってね。」'}</div><div class="actions">${btn(state.chapter===0?'ルナと話す':'ルナとお話しする',"go('story')",'primary')}${btn('今日のクエストを見る',"go('quest')")}${btn('魔法バトルへ',"go('battle')")}${btn('🗺️ 異世界を探索する',"go('map')")}</div>`}if(page==='map'){s=`<h2>🌙 ルミナの世界を歩こう</h2><p class="muted">マップをタップするとそこへ歩くよ。建物や人物に近づいて「調べる」を押してね。</p><div class="world-preview"><img src="${ART.mapart}" alt="魔法学園の街並みイメージ"></div><div class="map-frame"><canvas id="worldmap" width="360" height="480" aria-label="歩けるファンタジーマップ"></canvas></div><div class="actions">${btn('🔍 近くを調べる','interactMap()','primary')}${btn('⬆️','moveMap(0,-1)')}${btn('⬅️','moveMap(-1,0)')}${btn('⬇️','moveMap(0,1)')}${btn('➡️','moveMap(1,0)')}</div><div class="dialogue" id="map-hint">森や街を歩いてみよう。月光の森には不思議な妖精がいるよ。</div><p class="smallline">※ 今回はマップを歩く試作版。建物の内部や長い物語は今後追加するよ。</p>`}
if(page==='story'){let lines=[['ルナ','「ここはルミナ魔法学園。英語の知識を魔力に変える、不思議な場所よ。」'],['ルナ','「魔物に襲われたら、問題に答えて魔法を使ってね。正解すれば攻撃できるの！」'],['ルナ','「さあ、あなたの最初の冒険が始まるよ！」']];let step=Math.min(state.chapter,2);s=`<h2>📖 第1章・異世界への招待</h2>${scene('🧝‍♀️','案内役・ルナ')}<div class="dialogue"><strong>${lines[step][0]}</strong><br>${lines[step][1]}</div><div class="actions">${btn(step<2?'次の会話へ':'冒険を始める',step<2?'nextStory()':"go('quest')",'primary')}${btn('ホームに戻る',"go('home')")}</div>`}if(page==='quest'){let quests=[{name:'はじめての討伐',detail:'森のスライムを1体倒す',done:state.quest,reward:'100コイン・50 EXP'},{name:'図書館の秘密',detail:'月影のコウモリを1体倒す',done:state.quest2,reward:'140コイン・60 EXP'},{name:'塔の守護者',detail:'星屑のゴーレムを1体倒す',done:state.quest3,reward:'200コイン・90 EXP'}];s=`<h2>📜 冒険者ギルド</h2><p class="muted">英語の魔法で魔物を倒して依頼を達成しよう。報酬は初回だけ獲得できるよ。</p>${quests.map((q,i)=>`<div class="quest ${q.done?'done':''}"><div class="row"><strong>${q.done?'✅':'📜'} ${q.name}</strong><span class="tag">${q.done?'達成':'未達成'}</span></div><p>${q.detail}</p><div class="smallline">報酬：${q.reward}</div><div class="actions">${btn(q.done?'もう一度戦う':'討伐へ向かう',`startBattle(${i})`,'primary')}</div></div>`).join('')}`}if(page==='battle'){let en=enemies[enemyIndex];if(!question)question=qs[Math.floor(Math.random()*qs.length)];s=`<h2>⚔️ 魔法バトル</h2><div class="row"><span class="tag">${safe(en.name)}</span><span class="smallline">正解して攻撃！</span></div><div class="enemy">${monsterArt(enemyIndex)}</div><div class="row"><span>HP</span><span>${enemyHP}/${en.hp}</span></div><div class="bar"><span style="width:${Math.max(0,enemyHP/en.hp*100)}%"></span></div><h3>✨ 魔法の問題</h3><p>${safe(question.q)}</p><div class="choices">${question.a.map((a,i)=>btn(safe(a),`answer(${i})`)).join('')}</div><p class="muted">正解：10コイン + 15 EXP / 討伐成功：追加報酬</p><div class="actions">${btn('別の魔物を選ぶ',"go('quest')")}</div>`}if(page==='shop'){s=`<h2>🛍️ 星明かりのショップ</h2><p class="muted">魔法で稼いだコインを使って、好きな服や家具を集めよう。</p>${goods.map((g,i)=>`<div class="item"><span><strong>${g.icon} ${g.name}</strong><br><span class="smallline">🪙 ${g.cost}</span></span>${btn(state.items.includes(g.name)?'購入済み':'購入',`buy(${i})`,'primary',state.items.includes(g.name))}</div>`).join('')}`}if(page==='room'){
const worn=wardrobe.find(x=>x.name===state.outfit),acc=wardrobe.find(x=>x.name===state.accessory);
const shown=state.roomDecor.filter(x=>state.items.includes(x)).slice(0,5);
s=`<h2>🏡 わたしの異世界生活</h2>
<div class="hero-showcase"><div class="hero-portrait"><img src="${ART.hero}" alt="冒険者の美麗イラスト"></div><div class="hero-outfit">${characterSVG()}<small>現在の衣装</small></div></div><div class="ground">${worn?worn.icon+' '+safe(worn.name):'普段着'} ${acc?'・'+acc.icon:''}</div></div>
<h3>👗 着せ替えクローゼット</h3><p class="muted">買った服やアクセサリーを自由に組み合わせよう。</p>
<div class="item"><span>服：${worn?safe(worn.name):'普段着'}<br>飾り：${acc?safe(acc.name):'なし'}</span>${btn('全部外す','clearWear()')}</div>
${wardrobe.filter(x=>state.items.includes(x.name)).map(x=>`<div class="item"><span>${x.icon} ${safe(x.name)}</span>${btn(state[x.slot]===x.name?'外す':'身につける',`wear('${x.name}')`,'primary')}</div>`).join('')||'<p class="muted">服や髪飾りはショップで手に入るよ。</p>'}
<h3>🧙 アバター</h3><div class="choices" style="grid-template-columns:repeat(3,1fr)">${['🧙‍♀️','🧝‍♀️','🧑‍🎓','🧙','🧚','🐈'].map((a,i)=>btn(a,`avatar(${i})`,state.avatar===a?'primary':'' )).join('')}</div>
<h3>🛋️ お部屋の模様替え</h3>
<div class="roomview"><div class="roomwall">✦　☾　✧</div><div class="roomthings">${shown.map(x=>`<span title="${safe(x)}">${goods.find(g=>g.name===x)?.icon||'✨'}</span>`).join('')||'<span>🏠</span>'}</div><div class="roomfloor">お気に入りの家具を最大5個飾れるよ</div></div>
${furniture.filter(x=>state.items.includes(x)).map(x=>`<div class="item"><span>${goods.find(g=>g.name===x)?.icon||'✨'} ${safe(x)}</span>${btn(state.roomDecor.includes(x)?'片付ける':'飾る',`toggleFurniture('${x}')`,'primary')}</div>`).join('')||'<p class="muted">家具はショップで購入できるよ。</p>'}
<h3>🌱 魔法のガーデン</h3><div class="garden">${state.plantTime?'🌱　✨':'🌿'} ${Array.from({length:Math.min(state.flowers,8)},()=>'<span>🌷</span>').join('')}</div>
<p class="muted">種を植えて、少し待つと収穫できるよ。収穫でコインが増える！</p>
<div class="item"><span>🌾 種：${state.seeds}個<br>🍓 収穫：${state.harvests}回</span>${btn('種を買う（20🪙）','buySeed()','primary')}</div>
<div class="actions">${btn(state.plantTime?'育つまで待とう':'種を植える','sowSeed()','primary',!!state.plantTime||state.seeds<1)}${btn('🍓 収穫する（+45🪙）','harvest()','primary',!state.plantTime)}</div>
<p class="smallline">${state.plantTime?'植えた種は約1分で育つよ。収穫ボタンで確認してね。':'種を植えると栽培が始まるよ。'}</p>
<h3>🎁 コレクション ${state.items.length}/${goods.length}</h3>${state.items.length?state.items.map(name=>{let g=goods.find(x=>x.name===name);return `<div class="item">${g?g.icon:'✨'} ${safe(name)}</div>`}).join(''):'<p class="muted">まだ何も持っていないよ。</p>'}
<p class="smallline">累計バトル勝利：${state.wins}回</p>`;
}
document.getElementById('main').innerHTML=`<section class="panel">${s}<div class="toast" role="status">${safe(msg)}</div></section>`;if(page==='map')drawMap()}function visit(id){state.location=id;save();if(id==='academy')go('story');else if(id==='forest')startBattle(0);else if(id==='library')startBattle(1);else if(id==='tower')startBattle(2);else if(id==='town')go('shop');else go('room')}function decorate(i){state.decor=state.items[i];msg='✨ お部屋に飾ったよ！';save();render()}function nextStory(){state.chapter=Math.min(2,state.chapter+1);save();render()}function startBattle(i){enemyIndex=i;enemyHP=enemies[i].hp;question=null;go('battle')}function answer(i){if(!question)return;if(i===question.c){enemyHP--;state.coins+=10;msg='正解！ '+question.tip+' ✨ 魔法が命中！';gainXP(15);if(enemyHP<=0){let en=enemies[enemyIndex];state.wins++;state.coins+=50+enemyIndex*20;gainXP(35);msg='🎉 '+en.name+'を倒した！ 討伐報酬を獲得！';let flag=['quest','quest2','quest3'][enemyIndex];if(!state[flag]){state[flag]=true;let bonuses=[100,140,200],exps=[50,60,90];state.coins+=bonuses[enemyIndex];gainXP(exps[enemyIndex]);msg+=' 初回依頼達成！ +'+bonuses[enemyIndex]+'コイン';}enemyHP=en.hp}question=qs[Math.floor(Math.random()*qs.length)]}else{msg='もう一度！ '+question.tip;question=qs[Math.floor(Math.random()*qs.length)]}save();render()}function buy(i){let g=goods[i];if(state.items.includes(g.name))msg='もう持っているよ';else if(state.coins<g.cost)msg='コインが足りないよ。バトルで稼ごう！';else{state.coins-=g.cost;state.items.push(g.name);msg='✨ '+g.name+'を手に入れた！';save()}render()}function plant(){if(state.flowers>=8)msg='お庭はお花でいっぱい！';else if(state.coins<30)msg='30コイン必要だよ';else{state.coins-=30;state.flowers++;msg='🌷 お花が咲いた！';save()}render()}function wear(name){let x=wardrobe.find(v=>v.name===name);if(!x||!state.items.includes(name))return;state[x.slot]=state[x.slot]===name?'':name;msg='✨ 着せ替え完了！';save();render()}
function clearWear(){state.outfit='';state.accessory='';msg='普段着に戻したよ';save();render()}
function toggleFurniture(name){if(!furniture.includes(name)||!state.items.includes(name))return;let i=state.roomDecor.indexOf(name);if(i>=0)state.roomDecor.splice(i,1);else if(state.roomDecor.length>=5){msg='家具は5個まで飾れるよ';render();return}else state.roomDecor.push(name);msg='🛋️ お部屋を模様替えしたよ！';save();render()}
function buySeed(){if(state.coins<20)msg='コインが足りないよ';else{state.coins-=20;state.seeds++;msg='🌾 種を買ったよ！';save()}render()}
function sowSeed(){if(state.plantTime){msg='もう植えてあるよ'}else if(state.seeds<1){msg='先に種を買おう'}else{state.seeds--;state.plantTime=Date.now();msg='🌱 種を植えたよ！ 約1分後に収穫しよう';save()}render()}
function harvest(){if(!state.plantTime)msg='まだ何も育てていないよ';else if(Date.now()-state.plantTime<60000)msg='🌱 まだ成長中！ あと'+Math.ceil((60000-(Date.now()-state.plantTime))/1000)+'秒くらい待ってね';else{state.plantTime=0;state.harvests++;state.coins+=45;msg='🍓 収穫成功！ 45コインを獲得！';save()}render()}

function characterSVG(){let dress=state.outfit||'',acc=state.accessory||'',color=dress.includes('桜')?'#f3a7ca':dress.includes('月夜')?'#343b84':dress.includes('星空')?'#7074dc':'#f4f0fd';return `<svg viewBox="0 0 150 210" width="150" height="210" role="img" aria-label="着せ替えた冒険者"><defs><linearGradient id="hair" x2="1" y2="1"><stop stop-color="#e8c7a2"/><stop offset="1" stop-color="#9871a4"/></linearGradient></defs><ellipse cx="75" cy="197" rx="45" ry="9" fill="#0003"/><path d="M43 64Q32 9 75 10Q118 9 108 66L118 139H33Z" fill="url(#hair)"/><path d="M54 112L96 112L120 184Q75 204 30 184Z" fill="${color}" stroke="#fff0ff" stroke-width="3"/><path d="M54 114L40 145M96 114L110 145" stroke="#f5d2bf" stroke-width="12" stroke-linecap="round"/><path d="M75 117L75 181M51 149L99 149" stroke="#ffe9b4" stroke-width="3"/><rect x="67" y="92" width="16" height="24" rx="8" fill="#f5d2bf"/><ellipse cx="75" cy="62" rx="36" ry="42" fill="#f5d2bf"/><path d="M39 57Q29 10 75 14Q115 11 111 57Q98 39 89 34Q65 58 39 57" fill="url(#hair)"/><ellipse cx="60" cy="66" rx="4" ry="7" fill="#56436d"/><ellipse cx="90" cy="66" rx="4" ry="7" fill="#56436d"/><circle cx="61" cy="63" r="1.5" fill="white"/><circle cx="91" cy="63" r="1.5" fill="white"/><path d="M68 85Q75 90 82 85" stroke="#ba6c82" stroke-width="2" fill="none"/><ellipse cx="50" cy="81" rx="8" ry="4" fill="#f1a4ac" opacity=".5"/><ellipse cx="100" cy="81" rx="8" ry="4" fill="#f1a4ac" opacity=".5"/>${acc.includes('ティアラ')?'<path d="M49 28L54 8L73 25L90 7L101 28Z" fill="#e9dba2" stroke="#fff"/>':acc.includes('リボン')?'<path d="M96 30Q126 3 125 31Q124 48 96 33Q85 58 79 40Z" fill="#f4a4c8"/>':acc.includes('花')?'<text x="98" y="29" font-size="24">🌸</text>':''}<path d="M45 185L65 185L65 199L45 199M85 185L105 185L105 199L85 199" fill="#4a4269"/></svg>`}

function monsterSVG(i){const shapes=[`<path d="M38 113Q23 64 77 33Q133 63 116 113Q78 143 38 113" fill="#a77eea" stroke="#e2d2ff" stroke-width="4"/><circle cx="61" cy="91" r="6"/><circle cx="95" cy="91" r="6"/><path d="M68 108Q78 118 88 108" fill="none" stroke="#453267" stroke-width="3"/>`,`<path d="M80 68Q37 10 15 74L48 65L35 105L78 88L125 105L110 65L146 74Q125 10 80 68" fill="#7864a3" stroke="#c4adf4" stroke-width="4"/><circle cx="65" cy="76" r="5" fill="#ffcf8c"/><circle cx="95" cy="76" r="5" fill="#ffcf8c"/>`,`<path d="M48 37L112 37L125 83L111 132L48 132L35 83Z" fill="#8da3bf" stroke="#c8e4f2" stroke-width="5"/><path d="M68 48L91 48L101 82L80 99L59 82Z" fill="#9e7bea"/><circle cx="65" cy="92" r="5" fill="#f4dc96"/><circle cx="96" cy="92" r="5" fill="#f4dc96"/>`];return `<svg viewBox="0 0 160 160" width="180" height="180" role="img" aria-label="オリジナルモンスター">${shapes[i%3]}</svg>`}
function drawMap(){const c=document.getElementById('worldmap');if(!c)return;const ctx=c.getContext('2d'),T=24,W=15,H=20;let px=Math.max(0,Math.min(14,Number(state.mapX)||6)),py=Math.max(0,Math.min(19,Number(state.mapY)||7));state.mapX=px;state.mapY=py;
for(let y=0;y<H;y++)for(let x=0;x<W;x++){let road=(x===6||y===7||y===12||x===3&&y>=7||x===12&&y>=4);ctx.fillStyle=road?'#d9bfaa':(x+y)%3===0?'#709d84':'#79a88b';ctx.fillRect(x*T,y*T,T,T);if(!road&&((x*17+y*31)%11===0)){ctx.fillStyle='#416f66';ctx.beginPath();ctx.arc(x*T+12,y*T+10,8,0,7);ctx.fill();ctx.fillStyle='#a4cfb2';ctx.fillRect(x*T+10,y*T+12,4,8)}if((x*5+y*7)%29===0){ctx.fillStyle='#f9d1eb';ctx.beginPath();ctx.arc(x*T+17,y*T+17,2,0,7);ctx.fill()}}
for(const l of landmarks){let x=l.x*T+12,y=l.y*T+12;ctx.fillStyle='#293b4aaa';ctx.beginPath();ctx.roundRect(x-17,y-16,34,34,7);ctx.fill();ctx.font='24px serif';ctx.textAlign='center';ctx.fillText(({academy:'🏰',forest:'🌲',town:'🏘️',library:'📚',house:'🏡',tower:'🗼'})[l.kind],x,y+8)}
ctx.fillStyle='#fff3cb';ctx.beginPath();ctx.arc(px*T+12,py*T+12,12,0,7);ctx.fill();ctx.fillStyle='#503d71';ctx.beginPath();ctx.arc(px*T+12,py*T+9,6,0,7);ctx.fill();ctx.fillStyle='#b784da';ctx.beginPath();ctx.moveTo(px*T+12,py*T+12);ctx.lineTo(px*T+4,py*T+23);ctx.lineTo(px*T+20,py*T+23);ctx.fill();
c.onclick=e=>{let r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*15),y=Math.floor((e.clientY-r.top)/r.height*20);state.mapX=Math.max(0,Math.min(14,x));state.mapY=Math.max(0,Math.min(19,y));save();drawMap();showMapHint()};showMapHint()}
function showMapHint(){let h=document.getElementById('map-hint');if(!h)return;let near=landmarks.find(l=>Math.abs(l.x-state.mapX)+Math.abs(l.y-state.mapY)<=2);h.textContent=near?'✨ '+near.name+' が近い！「近くを調べる」で訪問しよう。':'🌿 風がそよいでいる。マップをタップして移動しよう。'}
function moveMap(dx,dy){state.mapX=Math.max(0,Math.min(14,(Number(state.mapX)||6)+dx));state.mapY=Math.max(0,Math.min(19,(Number(state.mapY)||7)+dy));save();drawMap()}
function interactMap(){let l=landmarks.find(v=>Math.abs(v.x-state.mapX)+Math.abs(v.y-state.mapY)<=2);if(!l){let h=document.getElementById('map-hint');if(h)h.textContent='🍃 足元には小さな花が咲いている。';return}visit(l.kind)}

function avatar(i){state.avatar=['🧙‍♀️','🧝‍♀️','🧑‍🎓','🧙','🧚','🐈'][i];msg='アバターを変更したよ！';save();render()}render();
