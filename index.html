<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Project Another World</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f6f0ff;background:#11152b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#4e3b75,#14172e 65%);min-height:100dvh}.wrap{max-width:560px;margin:auto;padding:22px 18px 70px}h1{font-family:Georgia,serif;font-size:30px;color:#f9db9b;text-align:center;margin:24px 0 4px}p.sub{text-align:center;color:#c9c1e0;font-size:12px;margin:0 0 22px}.stats,.tabs{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.pill{background:#302c50;border:1px solid #62577e;border-radius:25px;padding:8px 12px;font-size:13px}.panel{background:#252540df;border:1px solid #6c6189;border-radius:18px;padding:20px;margin-top:18px;box-shadow:0 8px 30px #0004}h2{margin:0 0 12px;font-size:20px;color:#f7d89a}button{cursor:pointer;font:inherit;color:white;border:1px solid #83739c;background:#4d416f;border-radius:12px;padding:12px 14px;min-height:45px}button:disabled{opacity:.45}button.primary{background:#926b9e;border-color:#d3a6d6;font-weight:700}.actions{display:grid;gap:9px;margin-top:16px}.tabs button{font-size:13px;padding:8px 10px;min-height:38px}.tabs button.active{background:#916d9e}.hint{font-size:14px;line-height:1.7;color:#d7d1e4}.enemy{font-size:65px;text-align:center;margin:10px}.bar{height:12px;border-radius:8px;background:#55516b;overflow:hidden}.bar span{display:block;height:100%;background:#e27c9c;transition:width .2s}.toast{color:#f7df9e;min-height:23px;font-size:14px;margin-top:12px}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0;padding:12px;border:1px solid #575070;border-radius:12px}.item button{white-space:nowrap}.small{font-size:12px;color:#c6c0d6}footer{text-align:center;color:#9992b0;font-size:11px;margin-top:22px}</style></head><body><div class="wrap"><h1>✦ Project Another World ✦</h1><p class="sub">A New Life Begins Beyond Reality · Mobile Prototype 0.2</p><div class="stats" id="stats"></div><div class="tabs" id="tabs"></div><main id="main"></main><footer>進行状況はこのブラウザ内に自動保存されます</footer></div><script>
const KEY='paw-mobile-v1';const initial=()=>({coins:0,xp:0,level:1,items:[],wins:0,quest:false});let state;try{state={...initial(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=initial()}let page='home',enemyHP=3,question=null,msg='';const questions=[{q:'「りんご」は英語で？',a:['Apple','Orange','Grape'],correct:0},{q:'「図書館」は英語で？',a:['Hospital','Library','Station'],correct:1},{q:'「勇敢な」は英語で？',a:['Quiet','Brave','Heavy'],correct:1},{q:'I ___ a student.',a:['am','is','are'],correct:0},{q:'「魔法」は英語で？',a:['Magic','Music','Market'],correct:0},{q:'She ___ English.',a:['study','studies','studying'],correct:1},{q:'「冒険」は英語で？',a:['Adventure','Weather','Furniture'],correct:0}];const goods=[{name:'魔法のリボン',icon:'🎀',cost:80},{name:'星の杖',icon:'🪄',cost:120},{name:'妖精のランプ',icon:'🏮',cost:150},{name:'小さな花壇',icon:'🌷',cost:100}];function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn('Save unavailable',e)}}function addXP(n){state.xp+=n;while(state.xp>=state.level*100){state.xp-=state.level*100;state.level++;msg+=' レベルアップ！✨'}}function escapeHTML(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function button(text,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${text}</button>`}function render(){document.getElementById('stats').innerHTML=`<span class="pill">⭐ Lv.${state.level}</span><span class="pill">✨ EXP ${state.xp}/${state.level*100}</span><span class="pill">🪙 ${state.coins}</span>`;document.getElementById('tabs').innerHTML=[['home','🏰 ホーム'],['quest','📜 クエスト'],['battle','⚔️ バトル'],['shop','🛍️ ショップ'],['room','🏡 マイルーム']].map(([p,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('');let s='';if(page==='home')s=`<h2>異世界へようこそ</h2><p class="hint">あなたは魔法の世界に召喚された冒険者。英語の知識が魔法の力になる世界で、クエストをこなし、仲間と暮らす準備を始めよう。</p><div class="enemy">🏰</div><div class="actions">${button('クエストを確認する',"go('quest')",'primary')}${button('魔物と戦う',"go('battle')")}</div>`;if(page==='quest')s=`<h2>📜 初めての討伐依頼</h2><p class="hint">村の近くにスライムが現れた！ 英語の魔法で1体倒して、報酬を手に入れよう。</p><p>進行状況：${state.quest?'✅ 達成済み':'未達成'}</p><p class="small">初回達成報酬：100コイン・経験値50</p><div class="actions">${button('討伐へ向かう',"go('battle')",'primary')}</div>`;if(page==='battle'){if(!question)question=questions[Math.floor(Math.random()*questions.length)];s=`<h2>⚔️ 魔法バトル</h2><div class="enemy">🟣</div><p class="hint" style="text-align:center">スライム HP ${enemyHP}/3</p><div class="bar"><span style="width:${enemyHP/3*100}%"></span></div><p class="hint"><b>魔法を発動するには正解を選ぼう！</b></p><h2>${escapeHTML(question.q)}</h2><div class="actions">${question.a.map((a,i)=>button(escapeHTML(a),`answer(${i})`)).join('')}</div>`}if(page==='shop')s=`<h2>🛍️ 星明かりのショップ</h2><p class="hint">バトルで集めたコインでお気に入りのアイテムを集めよう。</p>${goods.map((g,i)=>`<div class="item"><span>${g.icon} ${g.name}<br><span class="small">${g.cost} コイン</span></span>${button(state.items.includes(g.name)?'購入済み':'購入',`buy(${i})`,'primary')}</div>`).join('')}`;if(page==='room')s=`<h2>🏡 マイルーム</h2><div class="enemy">🪟🪴</div><p class="hint">ここはあなたの小さな部屋。集めたアイテムはここに飾られるよ。</p><h2>コレクション (${state.items.length}/${goods.length})</h2>${state.items.length?state.items.map(name=>`<p>✨ ${escapeHTML(name)}</p>`).join(''):'<p class="small">まだアイテムがありません。ショップで買ってみよう！</p>'}<p class="small">バトル勝利数：${state.wins}</p>`;document.getElementById('main').innerHTML=`<section class="panel">${s}<div class="toast" role="status">${escapeHTML(msg)}</div></section>`}function go(p){page=p;msg='';render()}function answer(i){if(i===question.correct){enemyHP--;msg='正解！ 魔法が命中した！ ✨';addXP(15);state.coins+=10;if(enemyHP<=0){enemyHP=3;question=null;state.wins++;state.coins+=50;addXP(35);msg='スライムを倒した！ 50コイン獲得！';if(!state.quest){state.quest=true;state.coins+=100;addXP(50);msg+=' 初回クエスト達成！ 100コイン獲得！'}}else question=questions[Math.floor(Math.random()*questions.length)]}else{msg='惜しい！ 正解は「'+question.a[question.correct]+'」。もう一度挑戦！';question=questions[Math.floor(Math.random()*questions.length)]}save();render()}function buy(i){const g=goods[i];if(state.items.includes(g.name))msg='すでに持っています';else if(state.coins<g.cost)msg='コインが足りません。バトルで集めよう！';else{state.coins-=g.cost;state.items.push(g.name);msg=g.name+'を手に入れた！';save()}render()}render();</script></body></html>
